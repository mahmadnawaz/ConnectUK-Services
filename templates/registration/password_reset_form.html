{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
{% endblock %}

{% block content %}
<div class="reset-wrapper">
    <div class="reset-card">
        <div class="brand-logo">
            <h3>ConnectUK Services</h3>
        </div>
        
        <h5 class="form-title">Forgot Your Password?</h5>
        <p class="form-desc">
            Enter your registered email address below, and we'll send you instructions to reset your password.
        </p>

        <form method="POST" class="reset-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_email" class="form-label">Email Address</label>
                <input type="email" name="email" autocomplete="email" maxlength="254" required id="id_email" class="form-control" placeholder="name@example.com">
            </div>

            <button type="submit" class="btn reset-btn">Send Reset Link</button>
        </form>

        <div class="text-center">
            <a href="{% url 'login' %}" class="back-to-login">&larr; Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
