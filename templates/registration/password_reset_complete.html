{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">
{% endblock %}

{% block content %}
<div class="reset-wrapper">
    <div class="reset-card text-center">
        <div class="brand-logo">
            <h3>ConnectUK Services</h3>
        </div>
        
        <div class="status-icon success-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        
        <h5 class="form-title">Password Reset Complete!</h5>
        <p class="form-desc">
            Your password has been set successfully. You can now log in to your account using your new password.
        </p>

        <a href="{% url 'login' %}" class="btn reset-btn py-2">Go to Login</a>
    </div>
</div>
{% endblock %}
